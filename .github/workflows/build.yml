# Builds the installers: one universal .dmg (Apple Silicon + Intel) and, for Windows, "hsk. studio Setup":
# our own setup window (setup/) carrying Tauri's NSIS installer inside it.
# Runs on a version tag (v0.1.0) or by hand; the release is published right away with the files attached.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            setup/src-tauri
      - run: npm install
      - run: cargo test --lib
        working-directory: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no signing yet: when the Apple certificate exists, add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID here (an empty value makes the build fail)
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "hsk. studio v__VERSION__"
          releaseDraft: false
          args: ${{ matrix.args }}

      # Windows: put the NSIS installer inside the hsk. setup window, build it, attach it to the same release
      - name: hsk. studio Setup
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./src-tauri/tauri.conf.json').version"
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { "v$version" }
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $nsis) { Write-Output "::error::NSIS installer not found"; exit 1 }
          # payload/ is not in git: make it before copying into it
          New-Item -ItemType Directory -Force setup/src-tauri/payload | Out-Null
          Copy-Item $nsis.FullName setup/src-tauri/payload/setup-nsis.exe -Force
          Push-Location setup
          node ../node_modules/@tauri-apps/cli/tauri.js build --no-bundle 2>&1 | Tee-Object -Variable log
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { Write-Output "::error::setup build failed: $((($log | Select-Object -Last 15) -join ' | '))"; exit 1 }
          $out = "hsk-studio-setup-$version.exe"
          Copy-Item setup/src-tauri/target/release/hsk-studio-setup.exe $out
          gh release upload $tag $out --clobber
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::upload of $out failed"; exit 1 }
          # "Ce e nou" in the app's update dialog is the release text: release-notes.md, written for each version
          if (Test-Path release-notes.md) { gh release edit $tag --notes-file release-notes.md }
          # people download one Windows file: our setup. The plain NSIS installer is inside it.
          # (GitHub stores the name with dots for spaces: "hsk.studio_…"); a miss here is not a failure
          gh release delete-asset $tag ($nsis.Name -replace '\.?\s+', '.') -y
          exit 0
