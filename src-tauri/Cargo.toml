[package]
name = "hsk-studio-companion"
version = "0.4.0"
description = "hsk. studio: trimite pozele din folderul de lucru direct în albumul hsk. photos"
edition = "2021"
rust-version = "1.77"

[lib]
name = "hsk_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "fs", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
notify = "6"
notify-debouncer-full = "0.3"
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png", "tiff"] }
webp = { version = "0.3", default-features = false }
hostname = "0.4"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
kamadak-exif = "0.5"

# the token lives in the system keychain: Keychain on macOS, Credential Manager on Windows
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
